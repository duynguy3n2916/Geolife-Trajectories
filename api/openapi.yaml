openapi: 3.0.3
info:
  title: Home/Office Inference API
  version: 1.2.0-cp2
  description: |
    Gợi ý **home** và **office** của một người dùng cho thanh tìm kiếm của app đặt xe.

    **Cách hoạt động: tính trước, tra cứu sau.**
    1. **Batch (không qua API):** chạy pipeline theo yêu cầu (lần đầu, khi đổi version model, khi demo) trên lịch sử GPS đã lưu của mọi người dùng
       và ghi kết quả home/office cho từng version model.
    2. **Tra cứu (API này):** khi người dùng bấm vào thanh tìm kiếm, backend của app gọi
       `GET /v1/users/{user_id}/home-office` và nhận ngay kết quả đã tính. API không chạy model trong request.

    Người gọi là **app đặt xe của chính người dùng**, kèm token đăng nhập (xem mục Đăng nhập). Mỗi người chỉ đọc được
    kết quả của chính mình.
    Bản demo CP2 dùng 182 user GeoLife 1.3 làm người dùng (mã ba chữ số, ví dụ `002`).

    Pipeline của batch: làm sạch (A3–A7), stay point (Li et al. 2008, neo h1_mean, D = 200 m, T = 30 phút,
    gap-stay ≤ 24 giờ; A12, A14), gom địa điểm, bỏ phiếu theo khung giờ địa phương (đêm 20–7h, làm việc 9–18h T2–T6; A10).

    **Về `confidence`.** Độ chắc của quy tắc bỏ phiếu (D18), tính bằng %: bốc lại có hoàn lại các phiếu 200 lần,
    bỏ phiếu lại, đếm % lần vẫn ra cùng nơi. **Không phải xác suất kết quả đúng**: không có đáp án home/office
    để hiệu chuẩn (A13). Dưới 7 phiếu thì `confidence` là `null`, kèm cờ `few_nights` / `few_workdays` (A11).
    App có thể chỉ hiện gợi ý khi `confidence` đủ cao.

    **Version model.** Có `heuristic-v1` (gom cụm tham lam 200 m) và `dbscan-v2` (DBSCAN). Version mặc định là bản
    đang được duyệt trong model registry. Có thể chọn bằng `model_version`. Response và header `X-Model-Version`
    ghi version đã dùng.
    Khi đang chạy **canary model theo người dùng**, một phần người dùng (chọn cố định theo `user_id`, băm sha256)
    nhận version model mới thay cho version mặc định; cùng một người dùng luôn nhận cùng một version.
    Header `X-Canary: true` cho biết người dùng này đang ở nhóm canary. Truyền `model_version` thì bỏ qua canary.

    **Đăng nhập (Amazon Cognito, đang bật).** Tài khoản nằm trong Cognito User Pool `home-office-users`, đăng nhập bằng
    email + mật khẩu (`InitiateAuth`, luồng `USER_PASSWORD_AUTH`, app client không có secret). Cognito trả ID token
    dạng JWT, sống 60 phút; app gửi `Authorization: Bearer <ID token>`.
    1. API Gateway (JWT authorizer) kiểm chữ ký, hạn, issuer và audience (= app client id) trước khi gọi Lambda.
       Thiếu token, token sai hoặc hết hạn: 401, body `{"message": "Unauthorized"}` do API Gateway trả.
    2. Lambda đọc claim `custom:geolife_id` (mã user GeoLife mà tài khoản được xem) và so với `{user_id}` trên đường dẫn.
       Khác nhau: 403 `forbidden`. Tài khoản trong nhóm `admin` (claim `cognito:groups`) xem được mọi `user_id`.
       Kiểm quyền xảy ra trước khi đọc kết quả, nên người dùng thường không dò được ai có hay không có kết quả (404).
    Phải gửi **ID token**, không phải access token: chỉ ID token có claim `custom:geolife_id`.
    Mã `user_id` trong bản demo là mã GeoLife, nên tài khoản do admin tạo (không cho tự đăng ký); người dùng không tự đổi
    được `custom:geolife_id`. Tài khoản demo: `userNNN@example.com` cho mỗi user GeoLife (ví dụ `user002@example.com` xem user 002),
    `admin@example.com` (nhóm admin). `GET /health` không cần đăng nhập.

    **Quyền riêng tư.** Vị trí nhà và nơi làm là dữ liệu nhạy cảm. Mọi endpoint trừ `/health` cần token đăng nhập,
    chỉ phục vụ qua HTTPS, không ghi tọa độ vào log. Tọa độ trả về làm tròn 4 chữ số thập phân (khoảng 11 m).

    **Lỗi.** Mọi lỗi trả `Error` với `code` cố định (ví dụ `user_not_found`).

    **Triển khai trên AWS (CP2).** API Gateway HTTP API (2 route, giới hạn 20 request/giây, dồn tối đa 50) gọi
    Lambda tra cứu; kết quả tính sẵn nằm trên S3, mỗi version một thư mục. Hạ tầng viết bằng Terraform (`deploy/terraform`).
    Đã tính cho 182 user; 166 user có kết quả, 16 user không có stay hoặc không đủ đêm / ngày làm việc nên trả 404.

    Thay đổi so với 1.0.0-cp2: bật đăng nhập Cognito (email + mật khẩu thay cho Google), token là ID token,
    quyền theo claim `custom:geolife_id` và nhóm `admin` thay cho bảng ánh xạ `sub`; `BearerAuth` đổi sang `http` / `bearer`.

    Thay đổi so với 0.4.0-cp2-draft: điền địa chỉ AWS thật, bỏ server cục bộ (bản FastAPI đã chuyển vào `archive/`),
    ghi rõ đăng nhập đang tắt, 404 cho người dùng không tìm ra home / office, 404 `not_found` cho đường dẫn lạ.

    Thay đổi so với 0.3.0-cp2-draft: thay API key `X-API-Key` bằng OAuth 2.0 (Google qua Cognito, token Bearer JWT),
    thêm kiểm tra người gọi chỉ đọc kết quả của chính mình (403 `forbidden`).

    Thay đổi so với 0.2.0-cp2-draft: theo mục đích tích hợp app đặt xe, chỉ giữ tra cứu theo người dùng.
    Bỏ `POST /v1/infer` (người dùng không tải GPS lên), `GET /v1/models` và 3 endpoint `/v1/geolife/...`
    (thay bằng `GET /v1/users/{user_id}/home-office`).
servers:
  - url: https://2ri5mspocd.execute-api.ap-southeast-1.amazonaws.com
    description: AWS, vùng Singapore (API Gateway, stage $default)
tags:
  - name: users
    description: Gợi ý home / office đã tính sẵn cho từng người dùng
  - name: meta
    description: Trạng thái dịch vụ
security:
  - BearerAuth: []
paths:
  /health:
    get:
      tags: [meta]
      summary: Kiểm tra dịch vụ còn chạy và version model mặc định đang dùng
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Dịch vụ hoạt động
          content:
            application/json:
              schema:
                type: object
                required: [status, default_model_version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  default_model_version:
                    type: string
                    example: heuristic-v1
  /v1/users/{user_id}/home-office:
    get:
      tags: [users]
      summary: Home và office gợi ý cho một người dùng
      description: |
        Trả kết quả đã tính sẵn bởi batch. Mỗi mục có thể là `null` khi chưa xác định được; lý do nằm ở `flags`.
        Office trùng home: `office` là `null` và `flags` chứa `home_eq_office`.
        Người dùng chưa có kết quả: 404 `user_not_found`, app không hiện gợi ý. Gồm người dùng mới chưa qua lần batch
        nào, và người dùng mà batch không tìm ra cả home lẫn office (không có stay, hoặc không có đêm / ngày làm việc nào có phiếu).
      operationId: getUserHomeOffice
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ModelVersion'
      responses:
        '200':
          description: Home và office kèm độ tin cậy
          headers:
            X-Model-Version:
              $ref: '#/components/headers/XModelVersion'
            X-Canary:
              $ref: '#/components/headers/XCanary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserHomeOffice'
              example:
                user_id: '002'
                model_version: heuristic-v1
                home:
                  lat: 39.9263
                  lon: 116.3372
                  confidence: 100.0
                  n_votes: 66
                office:
                  lat: 39.8998
                  lon: 116.3853
                  confidence: 100.0
                  n_votes: 44
                flags: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/StoreUnavailable'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ID token của Amazon Cognito (User Pool `home-office-users`, vùng ap-southeast-1). Lấy token:
        `POST https://cognito-idp.ap-southeast-1.amazonaws.com/` với header
        `X-Amz-Target: AWSCognitoIdentityProviderService.InitiateAuth`, `Content-Type: application/x-amz-json-1.1`,
        body `{"AuthFlow": "USER_PASSWORD_AUTH", "ClientId": "<app client id>", "AuthParameters": {"USERNAME": "<email>", "PASSWORD": "<mật khẩu>"}}`,
        rồi lấy `AuthenticationResult.IdToken`. Trên Windows: `.\api\get_token.ps1 user153@example.com`.
  headers:
    XModelVersion:
      description: Version model đã dùng để tính kết quả
      schema: {type: string}
    XCanary:
      description: |
        `true` nếu người dùng này đang ở nhóm canary model (nhận version model mới), `false` nếu không.
        Cố định theo `user_id` trong suốt một đợt canary. Cũng có trên 404 `user_not_found`.
      schema: {type: string, enum: ['true', 'false']}
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      description: Mã người dùng trong app. Bản demo dùng mã user GeoLife ba chữ số (ví dụ `002`).
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: '002'
    ModelVersion:
      name: model_version
      in: query
      required: false
      description: Version model. Bỏ trống thì dùng bản đang được duyệt trong registry.
      schema:
        type: string
        enum: [heuristic-v1, dbscan-v2]
        example: dbscan-v2
  responses:
    Unauthorized:
      description: |
        Thiếu token, token sai chữ ký hoặc hết hạn. API Gateway trả trước khi gọi Lambda, nên body là
        `{"message": "Unauthorized"}` chứ không theo schema `Error`.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthorized
    Forbidden:
      description: Token hợp lệ nhưng `user_id` trên đường dẫn khác `custom:geolife_id` của tài khoản, và tài khoản không trong nhóm `admin` (`forbidden`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UserNotFound:
      description: Chưa có kết quả cho người dùng này (`user_not_found`). Đường dẫn không tồn tại trả `not_found`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Tham số không hợp lệ (`validation_error`), gồm `model_version` không tồn tại (`unknown_model_version`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StoreUnavailable:
      description: Chưa có kết quả tính sẵn cho version này (`store_unavailable`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: user_not_found
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Flag:
      type: string
      description: |
        Lý do kết quả thiếu hoặc kém chắc.
        `no_stays`: không có stay. `no_night`, `no_workday`: không có phiếu đêm / ngày làm việc.
        `few_nights`, `few_workdays`: dưới 7 phiếu (A11); vẫn có kết quả nhưng `confidence` là `null`.
        `home_eq_office`: nơi thắng phiếu office trùng home nên office để trống.
        `unstable_home`, `unstable_office`: độ ổn định dưới 0,5.
        `multi_timezone`: dữ liệu nằm ở nhiều múi giờ (đi xa).
      enum: [no_stays, no_night, no_workday, few_nights, few_workdays, home_eq_office, unstable_home, unstable_office, multi_timezone]
    Location:
      type: object
      required: [lat, lon, confidence, n_votes]
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        confidence:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: "% lần bốc lại các phiếu vẫn ra nơi này (200 lần). null khi dưới 7 phiếu. Độ chắc của quy tắc, không phải xác suất đúng"
        n_votes:
          type: integer
          minimum: 0
          description: Số đêm (home) hoặc ngày làm việc (office) có phiếu
    UserHomeOffice:
      type: object
      required: [user_id, model_version, home, office, flags]
      properties:
        user_id: {type: string}
        model_version: {type: string}
        home:
          allOf:
            - $ref: '#/components/schemas/Location'
          nullable: true
        office:
          allOf:
            - $ref: '#/components/schemas/Location'
          nullable: true
        flags:
          type: array
          items:
            $ref: '#/components/schemas/Flag'
